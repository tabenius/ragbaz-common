# RAGBAZ scientific sources and data access points.
# Skeletons for later papers, essays and data adapters. One entry per source.
# kind: api | dataset | document | portal | gis
# verified: what was actually checked, with date. "listed" = seen in search
# results only, not fetched. Treat unverified endpoints as leads.
schema: ragbaz.sci-sources/0
updated: 2026-11-18

sources:
  # ---------------------------------------------------------------- cities, land, green space
  - id: oecd-sdmx-green-fua
    kind: api
    title: OECD Green areas in FUA urban centres (ESA WorldCover 2020)
    endpoint: https://sdmx.oecd.org/public/rest/data/OECD.CFE.EDS,DSD_FUA_ENV@DF_GREEN_AREA,/all?startPeriod=2020&format=csvfilewithlabels
    gives: green share of land (PT_LAR) and m2 per person (M2_PS) per functional urban area, worldwide
    notes: No key. Same method for every city, so cross-country comparable. Counts tree/shrub/grass cover, not public access.
    verified: 2026-11-18 fetched; Berlin 56.6% / 123 m2, Stockholm 60.5% / 157 m2, New York (Greater) 55.7% / 190 m2 (2021 values)
  - id: oecd-sdmx
    kind: api
    title: OECD Data Explorer SDMX REST API (all OECD dataflows)
    endpoint: https://sdmx.oecd.org/public/rest/
    gives: regions and cities, well-being, labour, environment; CSV or SDMX-JSON
    verified: 2026-11-18 (via the green-area dataflow)
  - id: eurostat-urb-lenv
    kind: dataset
    title: Eurostat urb_lenv, Environment - functional urban areas
    url: https://db.nomics.world/Eurostat/urb_lenv
    gives: share of land green urban areas + sports/leisure (EN5205V), city level
    notes: Also on the Eurostat API; DBnomics mirrors it with its own API.
    verified: listed 2026-11-18
  - id: copernicus-urban-atlas-2021
    kind: gis
    title: Copernicus Urban Atlas 2021 land cover / land use (vector)
    url: https://land.copernicus.eu/en/products/urban-atlas/urban-atlas-2021
    gives: comparable land use for European cities >100k; green urban areas split by public/private access
    notes: Access via Copernicus Data Space Ecosystem (OData API).
    verified: listed 2026-11-18
  - id: eea-green-umz
    kind: gis
    title: EEA percentage of green space in urban morphological zones (ArcGIS REST)
    endpoint: https://climate.discomap.eea.europa.eu/arcgis/rest/services/UAMV/Percentage_Green_Space_in_UMZ/MapServer
    verified: listed 2026-11-18
  - id: eea-sdi
    kind: portal
    title: EEA geospatial data catalogue (GeoNetwork API)
    url: https://sdi.eea.europa.eu/catalogue/
    verified: listed 2026-11-18
  - id: berlin-umweltatlas
    kind: portal
    title: Berlin Umweltatlas (land use, public green, green volume)
    url: https://www.berlin.de/umweltatlas/
    gives: per-block land use, public green provision, downloads (GIS)
    verified: listed 2026-11-18
  - id: hugsi
    kind: dataset
    title: HUGSI urban green space index (city profiles)
    url: https://hugsi.green/cities/Stockholm
    gives: green share and tree cover per city (Stockholm 46% green, 42% trees)
    notes: Method not checked; prefer OECD for comparisons.
    verified: listed 2026-11-18
  - id: nyc-manhattan-density-arcgis
    kind: gis
    title: Population density of Manhattan by km2 (ArcGIS FeatureServer)
    endpoint: https://services1.arcgis.com/7uJv7I3kgh2y7Pe0/ArcGIS/rest/services/Population_Density_of_Manhattan_WFL1/FeatureServer
    notes: Third-party layer; for official figures use US Census (Manhattan 2020 pop 1,694,251 on ~59 km2 land, ~28,700/km2).
    verified: listed 2026-11-18
  - id: citypopulation
    kind: portal
    title: City Population (Brinkhoff)
    url: https://www.citypopulation.de/
    verified: listed 2026-11-18
  - id: hdx
    kind: portal
    title: Humanitarian Data Exchange (CKAN API)
    url: https://data.humdata.org/
    verified: listed 2026-11-18

