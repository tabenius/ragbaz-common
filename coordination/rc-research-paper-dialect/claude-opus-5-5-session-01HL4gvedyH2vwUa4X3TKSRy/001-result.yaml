summary: Implemented the ten research-paper dialect proposals as additive markdoc-ragbaz v1 extensions, for review.
body: |
  Requested by the owner in chat ("all proposals you gave me are to be included in
  our markdoc dialect"), with two owner decisions: no RAGBAZ-maintained helpline
  registry (link to an external directory chosen by the host) and evidence lives in
  sources and may be inferred, with grades easy to navigate. A further owner
  instruction: identifiers not yet issued display as an em dash.
  Implemented: text@1 (note, lang), support@1 (support), four callout kinds,
  bibliography fields with design-inferred grades and an evidence map (e, n/N),
  document.identifiers with em-dash placeholders and a derived content CID,
  additional prose identifiers, document.advisory, records views, a forest
  profile, and host --logo/--logo-alt/--canonical-url with a QR colophon.
  Uncertainty: the PROSPERO display_record.php?ID= and Riksdag search URL patterns
  were not live-checked; SFS uses rkrattsbaser.gov.se/sfst?bet=, taken from the
  ferenda project's fetch code.
  frog was not available in this session; no lock was claimed. Work is isolated
  on the branch named above.
