name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Require browser coverage
        run: sudo ln -sf '${{ steps.chrome.outputs.chrome-path }}' /usr/bin/chromium
      - run: npm test
      - run: npm run markdoc-ragbaz-sci-tufte -- --output "$RUNNER_TEMP/meta"
